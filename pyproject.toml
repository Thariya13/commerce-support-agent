[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopassist"
version = "0.1.0"
description = "E-commerce shopping and customer-service agent on LangGraph: catalog search, orders, returns with human approval, guardrails, human handoff and an evaluation suite"
readme = "README.md"
authors = [
    { name = "Tharindu Gunarathna", email = "iamthandu@gmail.com" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # LangChain v1 ecosystem
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0",
  # Services
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "numpy>=1.26",
  "typer>=0.12",
  "tqdm>=4.66",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]
qdrant = ["langchain-qdrant>=0.2.1", "qdrant-client>=1.12", "fastembed>=0.4"]
anthropic = ["langchain-anthropic>=1.0"]
observability = ["langfuse>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["shopassist[postgres,qdrant,observability]"]

[project.scripts]
shopassist = "shopassist.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/shopassist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs the full LangChain/LangGraph/FastAPI stack (no network or API keys)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501", "B008", "E402"]
